on:
  push:
    branches: [main]
  pull_request:

name: CI

jobs:
  build:
    name: Build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Enable the llvmpipe back-end of rusticl, installed below via
      # `mesa-opencl-icd`. Required for the "run all samples" step to
      # find a SPIR-V-capable OpenCL device; `fp64` lets the nbody
      # sample (which uses `cl::Double3`) execute too. No effect on
      # the earlier fmt / clippy / cargo check steps.
      RUSTICL_ENABLE: llvmpipe
      RUSTICL_FEATURES: fp64
    steps:
      - uses: actions/checkout@v4

      - name: Install rust-toolchain
        run: rustup component add rustfmt clippy

      - name: Install rusticl OpenCL ICD
        run: |
          sudo apt-get update -y -qq
          # `kisak-mesa` ships the rusticl OpenCL ICD via
          # `mesa-opencl-icd`; older Ubuntu archives do not.
          sudo add-apt-repository ppa:kisak/kisak-mesa -y
          sudo apt-get update
          sudo apt install -y mesa-opencl-icd

      - name: cargo fetch --locked
        run: cargo fetch --locked

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo check kernels
        run: cargo check -p collatz -p mandelbrot

      - name: cargo check runner
        run: cargo check -p runner

      - name: run all samples
        # No CLI arg → the runner's match arm dispatches to every
        # `run_*` in sequence (collatz, mandelbrot, reduce,
        # debug-abort, mandelbrot-image, raymarch, nbody). Each
        # compiles its kernel via spirv-builder and runs it on the
        # rusticl / llvmpipe device installed above.
        run: cargo run -p runner --release
